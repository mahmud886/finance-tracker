<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Finance Tracker social preview</title>
  <desc id="desc">Finance Tracker helps you track spending, budgets, plans, and loans in one place.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#052E2B" />
      <stop offset="0.55" stop-color="#0A3B38" />
      <stop offset="1" stop-color="#0F4F4A" />
    </linearGradient>
    <linearGradient id="panel" x1="160" y1="120" x2="1040" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <circle cx="1030" cy="120" r="210" fill="#10B981" fill-opacity="0.18" />
  <circle cx="160" cy="620" r="240" fill="#34D399" fill-opacity="0.1" />

  <rect x="120" y="90" width="960" height="450" rx="28" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.18" />

  <rect x="170" y="150" width="170" height="38" rx="19" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.55" />
  <text x="255" y="175" text-anchor="middle" fill="#CCFBF1" font-size="19" font-family="Inter, Arial, sans-serif" font-weight="600">Personal Finance</text>

  <text x="170" y="255" fill="#ECFEFF" font-size="72" font-family="Inter, Arial, sans-serif" font-weight="800">Finance Tracker</text>
  <text x="170" y="315" fill="#CFFAFE" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="500">Track money with a calmer, clearer workflow.</text>
  <text x="170" y="362" fill="#A5F3FC" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="400">Transactions, budgets, plans, loans, and reports in one place.</text>

  <g>
    <rect x="170" y="410" width="240" height="56" rx="14" fill="url(#accent)" />
    <text x="290" y="445" text-anchor="middle" fill="#042F2E" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">Start Free</text>
  </g>

  <g fill="#99F6E4" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">
    <text x="780" y="434">Realtime updates</text>
    <text x="780" y="468">Secure auth + RLS</text>
    <text x="780" y="502">CSV and PDF exports</text>
  </g>

  <g>
    <circle cx="740" cy="428" r="6" fill="#34D399" />
    <circle cx="740" cy="462" r="6" fill="#34D399" />
    <circle cx="740" cy="496" r="6" fill="#34D399" />
  </g>
</svg>

